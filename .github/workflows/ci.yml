name: CI

# Pull requests and pushes to main: web build, typecheck, lint and tests; server typecheck, lint and tests;
# a Docker build with a smoke test of the container. Nothing is pushed, so a merge never changes what Flux
# nodes pull.
# Publishing is deliberate: run this workflow by hand from main with "publish" ticked (Actions, CI, Run
# workflow, or `gh workflow run ci.yml --ref main -f publish=true`) to push littlestache/community:latest
# and :sha-<short> to Docker Hub.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to Docker Hub (only honoured on main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: littlestache/community

jobs:
  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build

  server:
    name: Server (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci --no-audit --no-fund
      - run: npm --prefix server run typecheck
      - run: npm --prefix server run lint
      - run: npm --prefix server test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [web, server]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: community:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name community -p 42069:42069 -e FIXTURES=1 community:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:42069/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:42069/healthz
          curl -fsS http://127.0.0.1:42069/api/v1/network | head -c 300; echo
          curl -fsS -o /dev/null http://127.0.0.1:42069/
          test "$(docker exec community id -u)" != "0"
          docker rm -f community

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (manual run from main only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
